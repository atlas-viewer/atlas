name: Release NPM package

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release/next')
    runs-on: ubuntu-latest
    name: Node build
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - uses: pnpm/action-setup@v3
        with:
          version: 11
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - run: pnpm build
      - run: pnpm exec vitest run
      - run: pnpm run lint

  release:
    needs: [build]
    runs-on: ubuntu-latest
    name: Release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      - uses: pnpm/action-setup@v3
        with:
          version: 11
          run_install: |
            - recursive: true
              args: [--frozen-lockfile]

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Git tag must match package.json version (v$version)"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            npm publish --tag next
          else
            npm publish --tag latest
          fi

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          args=()
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "v$version" --target "$(git rev-parse HEAD)" \
            --title "v$version" --generate-notes "${args[@]}"
